<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241417"/>
      <stop offset="55%" stop-color="#2f6b66"/>
      <stop offset="100%" stop-color="#1a3d39"/>
    </linearGradient>
    <pattern id="suits" width="160" height="160" patternUnits="userSpaceOnUse">
      <text x="20" y="60" font-size="64" fill="rgba(217,164,65,0.14)" font-family="Georgia, serif">&#9827;</text>
      <text x="90" y="140" font-size="64" fill="rgba(156,43,60,0.16)" font-family="Georgia, serif">&#9830;</text>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
